<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Mimir Studio: the rune ᛗ (Mannaz, Mímir's M) on a dark violet tile, with the eye in Mímir's well, over a broken
       chain (half of it, drawn twice) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d358f"/>
      <stop offset="1" stop-color="#191640"/>
    </linearGradient>
    <linearGradient id="eye" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffb627"/>
    </linearGradient>
    <clipPath id="in"><rect x="0.75" y="0.75" width="22.5" height="22.5" rx="5.6"/></clipPath>
    <g id="chain" clip-path="url(#in)" fill="none" stroke="#8f86f0" stroke-width="1" stroke-linecap="round">
      <path d="M0 18.6H4.8M5.6 18.6H9.8" stroke-width="1.1"/>
      <rect x="-2.2" y="17.3" width="4.2" height="2.6" rx="1.3"/>
      <rect x="3.4" y="17.3" width="4.2" height="2.6" rx="1.3"/>
      <path d="M10.2 17.3H9.7A1.3 1.3 0 0 0 9.7 19.9H10.2"/>
      <path d="M11.35 17.15L10.95 16.5M11.35 20.05L10.95 20.7" stroke-width="0.7"/>
    </g>
  </defs>
  <rect x="0.75" y="0.75" width="22.5" height="22.5" rx="5.6" fill="url(#tile)"/>
  <use href="#chain"/>
  <use href="#chain" transform="matrix(-1 0 0 1 24 0)"/>
  <rect x="0.75" y="0.75" width="22.5" height="22.5" rx="5.6" fill="none" stroke="#a59cff" stroke-opacity="0.4" stroke-width="0.6"/>
  <path d="M7 15.4V4.4l10 6.6M17 15.4V4.4L7 11" fill="none" stroke="#ece9ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="12" cy="13" r="1.6" fill="url(#eye)"/>
</svg>
