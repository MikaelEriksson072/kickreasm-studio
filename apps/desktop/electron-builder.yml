# Windows packaging (spec 3). `pnpm --filter @mimir/desktop package` runs `electron-vite build`
# and then electron-builder, which writes an NSIS installer and a portable exe to release/<version>/.
# The packaged app is out/ (main, preload, renderer) plus the production dependencies (zod);
# @mimir/core is bundled into out/ by electron-vite.
appId: studio.mimir.desktop
productName: Mimir Studio
executableName: Mimir Studio
copyright: Copyright © 2026 Mimir Studio

directories:
  output: release/${version}

files:
  - out/**/*
  - package.json

# reuse the Electron binary pnpm installed instead of downloading it again
electronDist: node_modules/electron/dist

asar: true

# unp64 for packed PRGs (vendor/unp64/README.md) and Exomizer for the Pack view (vendor/exomizer/README.md): installed
# as resources\unp64\ and resources\exomizer\, where the main process finds them and points the settings at them.
# Their notices (unp64.txt, LICENSE.txt) come along, as their license asks.
extraResources:
  - from: vendor/unp64
    to: unp64
  - from: vendor/exomizer
    to: exomizer

win:
  # build/icon.ico: the Mimir Studio logo, drawn from build/icon.svg by scripts/make-icons.cjs
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mimir Studio
  artifactName: Mimir-Studio-${version}-setup.${ext}

portable:
  artifactName: Mimir-Studio-${version}-portable.${ext}
